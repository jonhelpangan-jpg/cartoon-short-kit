name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches:
      - desktop-offline-packaging
    paths:
      - "package.json"
      - "desktop/**"
      - "start-offline.bat"
      - "index.html"
      - "*.js"
      - "lib/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out packaging branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install build dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist

      - name: Create offline browser ZIP
        shell: pwsh
        run: |
          git archive --format=zip --output=release/cartoon-short-kit-offline-browser.zip HEAD

      - name: Upload installer and offline browser package
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-short-kit-windows
          path: |
            release/*.exe
            release/cartoon-short-kit-offline-browser.zip
          if-no-files-found: error
          retention-days: 30
